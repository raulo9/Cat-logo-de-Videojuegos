<!DOCTYPE html>
<!-- Página de añadir videojuego del catálogo de videojuegos -->
<html lang="es">
<head>
	<meta charset="utf-8"> <!-- para que se vean bien las tildes y la ñ -->
	<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- necesario para que la web se adapte al móvil-->
	<link rel="stylesheet" type="text/css" href="estilos/estilos.css"> <!-- aquí cargo mis estilos -->
	<title>Catálogo de Videojuegos</title>
</head>
<!-- data-pagina le dice a app.js en qué página estoy para que arranque la parte correcta -->
<body data-pagina="nuevo">
    <!-- El menú de arriba está vacío: lo rellena app.js con el titulo, hamburguesa y botones -->
    <div id="menu" class="menu-nav"></div>

    <!-- Contenedor principal: aquí va el contenido de la página -->
    <div id="contenedor">
	<!-- Caja del formulario -->
	<div class="registro">
	<form id="form-nuevo">
	    <!-- Título del juego es obligatorio-->
	    <label>Título:</label>
	    <input type="text" name="titulo" placeholder="Ingrese el nombre del videojuego" required>

	    <!-- Lista desplegable con las plataformas -->
	    <label>Plataforma:</label>
	    <select name="plataforma" required>
            <option value="PC">PC</option>
            <option value="PlayStation">PlayStation</option>
            <option value="Xbox">Xbox</option>
            <option value="Nintendo Switch">Nintendo Switch</option>
            <option value="Sega Mega Drive">Sega Mega Drive</option>
        </select>

        <!-- Lista desplegable con los géneros -->
        <label>Género:</label>
	    <select name="genero" required>
            <option value="Acción">Acción</option>
            <option value="Aventura">Aventura</option>
            <option value="RPG">RPG</option>
            <option value="Deportes">Deportes</option>
        </select>

        <!-- Para subir la carátula: solo deja elegir imágenes y es obligatoria -->
        <label>Carátula (Imagen):</label>
        <input type="file" name="imagen" accept="image/*" required>

        <!-- Año en que salió el juego con números -->
        <label>Año de lanzamiento:</label>
	    <input type="number" name="anio_lanzamiento" placeholder="Ej: 2024" required>

	    <!-- Aquí app.js escribe los mensajes de error si los hay -->
	    <p class="mensaje" id="mensaje"></p>
	    <!-- Botón de enviar: app.js guarda el juego al pulsarlo -->
	    <input class="boton" type="submit" value="Crear">
	</form>
	</div>
    </div>
    <!-- Cargo el JavaScript al final, cuando todo el HTML ya existe -->
    <script src="js/app.js"></script>
</body>
</html>
