<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="estilos/estilos.css">
	<title>Catálogo de Videojuegos</title>
</head>
<body data-pagina="editar">
    <div id="menu" class="menu-nav"></div>

    <div id="contenedor">
	<div class="registro">
	<form id="form-editar">
	    <label>Título:</label>
	    <input type="text" name="titulo" required>

	    <label>Plataforma:</label>
	    <select name="plataforma" required>
            <option value="PC">PC</option>
            <option value="PlayStation">PlayStation</option>
            <option value="Xbox">Xbox</option>
            <option value="Nintendo Switch">Nintendo Switch</option>
            <option value="Sega Mega Drive">Sega Mega Drive</option>
        </select>

        <label>Género:</label>
	    <select name="genero" required>
            <option value="Acción">Acción</option>
            <option value="Aventura">Aventura</option>
            <option value="RPG">RPG</option>
            <option value="Deportes">Deportes</option>
        </select>

        <label>Nueva Carátula (dejar en blanco para mantener la actual):</label>
        <input type="file" name="imagen" accept="image/*">

        <label>Año de lanzamiento:</label>
	    <input type="number" name="anio_lanzamiento" required>

	    <p class="mensaje" id="mensaje"></p>
	    <input class="boton" type="submit" value="Actualizar">
	</form>
	</div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
